<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opslagstavle-test</title>
<link rel="stylesheet" href="/src/theme.css">
</head>
<body>
<!-- Dev only (not in the Vite build inputs): the opslagstavle on made-up posts, so the look can
     be worked on without Theta. The people here are invented, like the seed data. -->
<!-- /board-test.html opens the menu as it is in the room; ?kork shows the wall board's drawing. -->
<div id="kork" style="padding:40px;display:none"></div>
<script type="module">
import { createBoard } from '/src/board/board.ts'
import { createBoardMenu } from '/src/klubhus/boardmenu.ts'

const now = Date.now()
const iso = (minutesAgo) => new Date(now - minutesAgo * 60_000).toISOString()
const POSTS = [
  { id: '1', author: { sub: 's1', name: 'Medlem 1' }, title: 'Mødet på tirsdag', pinned: true,
    body: 'Vi starter 11.30 som altid. Husk at vælge et album, hvis det er din tur.',
    createdAt: iso(40), commentCount: 4, attachmentCount: 0, url: 'https://stage.theta.dk/p/1', lyttefest: null },
  { id: '2', author: { sub: 's2', name: 'Medlem 2' }, title: null, pinned: false,
    body: 'Jeg fandt den her i en kasse på loftet.\nNogen der kender den?',
    createdAt: iso(180), commentCount: 2, attachmentCount: 3, url: 'https://stage.theta.dk/p/2', lyttefest: null },
  { id: '3', author: { sub: 's3', name: 'Medlem 3' }, title: 'Pladebørs på lørdag', pinned: false,
    body: 'Der er pladebørs i Valby. Nogen der tager afsted?',
    createdAt: iso(60 * 26), commentCount: 0, attachmentCount: 0, url: 'https://stage.theta.dk/p/3', lyttefest: null },
  { id: '4', author: { sub: 's1', name: 'Medlem 1' }, title: null, pinned: false,
    body: 'Lyttefest: Kate Bush – The Kick Inside, tirsdag 3. november kl. 11.30',
    createdAt: iso(60 * 30), commentCount: 1, attachmentCount: 0, url: 'https://stage.theta.dk/p/4',
    lyttefest: { id: 1, artist: 'Kate Bush', title: 'The Kick Inside', coverUrl: null } },
]
const OLDER = [
  { id: '5', author: { sub: 's2', name: 'Medlem 2' }, title: 'Referat fra møde 21', pinned: false,
    body: 'Ligger i mappen nu.', createdAt: iso(60 * 24 * 9), commentCount: 0, attachmentCount: 1,
    url: 'https://stage.theta.dk/p/5', lyttefest: null },
  { id: '6', author: { sub: 's3', name: 'Medlem 3' }, title: null, pinned: false,
    body: 'Er der nogen der har en pladespiller til overs? Min er gået i stykker igen, og det er tredje gang i år.',
    createdAt: iso(60 * 24 * 12), commentCount: 7, attachmentCount: 0, url: 'https://stage.theta.dk/p/6', lyttefest: null },
]
const GROUP_URL = 'https://stage.theta.dk/grupper/122304557724776'

// The server, as it would answer. The board only ever reads.
const real = window.fetch
window.fetch = async (url, init) => {
  const path = String(url)
  await new Promise((r) => setTimeout(r, 120))
  const json = (b) => new Response(JSON.stringify(b), { status: 200, headers: { 'content-type': 'application/json' } })
  if (path === '/api/me') return json({ sub: 'me', name: 'Dig', picture: null })
  // A second page, so "Hent flere" has something to fetch.
  if (path.startsWith('/api/board?cursor=')) return json({ items: OLDER, nextCursor: null, groupUrl: GROUP_URL })
  if (path.startsWith('/api/board')) return json({ items: POSTS, nextCursor: 'c2', groupUrl: GROUP_URL })
  return real(url, init)
}

const board = createBoard(() => menu.draw())
const menu = createBoardMenu({
  board,
  onClose: () => { document.body.innerHTML = '<p style="padding:40px">Lukket. Genindlæs for at åbne igen.</p>' },
  // A dev page should not open Theta in a new tab every time a row is pressed.
  openUrl: (url) => console.log('åbner', url),
})

if (location.search.includes('kork')) {
  // The wall board's own texture, blown up, so the notes can be read while they are drawn.
  const { createCorkBoard } = await import('/src/klubhus/corkboard.ts')
  const { buildClubLayout } = await import('/src/klubhus/layout.ts')
  const kork = document.getElementById('kork')
  kork.style.display = 'block'
  for (const [label, posts] of [['Opslag', POSTS], ['Tom', []], ['Fejl', 'error']]) {
    const cork = createCorkBoard(buildClubLayout([]))
    cork.setPosts(posts)
    const src = cork.texture.image
    const big = document.createElement('canvas')
    big.width = src.width * 3
    big.height = src.height * 3
    const g = big.getContext('2d')
    g.imageSmoothingEnabled = false
    g.drawImage(src, 0, 0, big.width, big.height)
    const h = document.createElement('p')
    h.textContent = label
    kork.append(h, big)
  }
} else {
  menu.open()
}
</script>
</body>
</html>
